version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8

    # On reste strictement sur l'écosystème javax + Tomcat 9
    ignore:
      # Spring Framework → max 5.3.x
      - dependency-name: "org.springframework:*"
        versions: [">=6.0.0"]

      # Spring Security → max 5.8.x
      - dependency-name: "org.springframework.security:*"
        versions: [">=6.0.0"]

      # Hibernate → max 5.6.x
      - dependency-name: "org.hibernate:*"
        versions: [">=6.0.0"]
      - dependency-name: "org.hibernate.orm:*"
        versions: [">=6.0.0"]

      # Interdiction des packages Jakarta (Tomcat 10+)
      - dependency-name: "jakarta.servlet:*"
      - dependency-name: "jakarta.mail:*"
      - dependency-name: "jakarta.persistence:*"
      - dependency-name: "jakarta.annotation:*"

      # spring-mobile est abandonné
      - dependency-name: "org.springframework.mobile:*"
